<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rounded square + abstract family/home shape — flamingo pink (Asana) -->
  <rect width="32" height="32" rx="8" fill="#F06A6A"/>
  <!-- Three circles = family members -->
  <circle cx="16" cy="9" r="4" fill="white"/>
  <circle cx="8"  cy="9" r="3" fill="white" opacity="0.75"/>
  <circle cx="24" cy="9" r="3" fill="white" opacity="0.75"/>
  <!-- Connected arc below = unity -->
  <path d="M4 24 Q16 14 28 24" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
