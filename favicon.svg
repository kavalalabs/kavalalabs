  <!-- Left veins -->
  <line x1="16" y1="13" x2="9"  y2="18" stroke="#145c2c" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="16" y1="18" x2="9"  y2="23" stroke="#145c2c" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- Right veins -->
  <line x1="16" y1="13" x2="23" y2="18" stroke="#145c2c" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="16" y1="18" x2="23" y2="23" stroke="#145c2c" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- Highlight -->
  <path d="M16 4 C10 4 6 10 6 15 C8 10 12 6 16 5Z" fill="#2db352" opacity="0.4"/>
