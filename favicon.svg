<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">

  <!-- Trunk -->
  <line x1="16" y1="30" x2="16" y2="16" stroke="#3d6b35" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Main branches -->
  <line x1="16" y1="22" x2="9"  y2="16" stroke="#3d6b35" stroke-width="2"   stroke-linecap="round"/>
  <line x1="16" y1="21" x2="23" y2="15" stroke="#3d6b35" stroke-width="2"   stroke-linecap="round"/>

  <!-- Upper branches -->
  <line x1="16" y1="17" x2="11" y2="11" stroke="#3d6b35" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="21" y2="10" stroke="#3d6b35" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Center shoot -->
  <line x1="16" y1="16" x2="16" y2="8"  stroke="#3d6b35" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Buds -->
  <circle cx="9"  cy="15"  r="3"   fill="#22c97a"/>
  <circle cx="23" cy="14"  r="3"   fill="#22c97a"/>
  <circle cx="11" cy="10"  r="2.5" fill="#2dd882"/>
  <circle cx="21" cy="9"   r="2.5" fill="#2dd882"/>
  <circle cx="16" cy="6.5" r="2.8" fill="#f5a623"/>

  <!-- Ground -->
  <line x1="11" y1="30.5" x2="21" y2="30.5" stroke="#3d6b35" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
